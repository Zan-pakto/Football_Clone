<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 800" width="2400" height="800" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="2400" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E0B24"/>
      <stop offset="50%" stop-color="#140F35"/>
      <stop offset="100%" stop-color="#080616"/>
    </linearGradient>
    <linearGradient id="jt-mark-hires-dark" x1="200" y1="40" x2="200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E3C"/>
      <stop offset="45%" stop-color="#ED101B"/>
      <stop offset="100%" stop-color="#A90717"/>
    </linearGradient>
    <linearGradient id="text-white-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#C5BEFF"/>
    </linearGradient>
    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#ED101B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="2400" height="800" rx="36" fill="url(#bg-grad)"/>
  <rect width="2396" height="796" x="2" y="2" rx="34" stroke="rgba(167, 159, 255, 0.18)" stroke-width="2"/>

  <!-- Left: Stylized Icon Mark (500x500 box scaled into 540x540) -->
  <g transform="translate(130, 130) scale(0.54)" filter="url(#glow-dark)">
    <path d="M60 0h940l-100 170H0L60 0Z" fill="url(#jt-mark-hires-dark)"/>
    <path d="M260 150h180v520c0 180-110 330-310 330H0l50-170h80c80 0 130-50 130-150V150Z" fill="url(#jt-mark-hires-dark)"/>
    <path d="M610 150h180v850H580l30-850Z" fill="url(#jt-mark-hires-dark)"/>
  </g>

  <!-- Right: Typography -->
  <g transform="translate(730, 440)">
    <!-- Primary Brand Name -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="210" font-weight="900" letter-spacing="-4" fill="url(#text-white-grad)">
      JOLLOF<tspan fill="#ED101B">TIPS</tspan>
    </text>

    <!-- Tagline -->
    <text x="8" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="700" letter-spacing="10" fill="#9B92C9">
      QUANTITATIVE AI FOOTBALL INTELLIGENCE
    </text>
  </g>
</svg>
