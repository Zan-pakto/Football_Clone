<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 640" width="2400" height="640" fill="none">
  <defs>
    <linearGradient id="jt-mark-hires-full" x1="200" y1="40" x2="200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2432"/>
      <stop offset="45%" stop-color="#ED101B"/>
      <stop offset="100%" stop-color="#9E0513"/>
    </linearGradient>
    <linearGradient id="text-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F3F0FF"/>
      <stop offset="100%" stop-color="#C5BEFF"/>
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#ED101B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left: Stylized Icon Mark (500x500 box scaled into 520x520) -->
  <g transform="translate(60, 60) scale(0.52)" filter="url(#subtle-glow)">
    <path d="M60 0h940l-100 170H0L60 0Z" fill="url(#jt-mark-hires-full)"/>
    <path d="M260 150h180v520c0 180-110 330-310 330H0l50-170h80c80 0 130-50 130-150V150Z" fill="url(#jt-mark-hires-full)"/>
    <path d="M610 150h180v850H580l30-850Z" fill="url(#jt-mark-hires-full)"/>
  </g>

  <!-- Right: Typography -->
  <g transform="translate(640, 360)">
    <!-- Primary Brand Name -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-size="205" font-weight="900" letter-spacing="-4" fill="url(#text-gold)">
      JOLLOF<tspan fill="#ED101B">TIPS</tspan>
    </text>

    <!-- Tagline -->
    <text x="8" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="700" letter-spacing="10" fill="#9B92C9">
      QUANTITATIVE AI FOOTBALL INTELLIGENCE
    </text>
  </g>
</svg>
